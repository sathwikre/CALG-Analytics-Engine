<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CALG Coefficient Generator</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, system-ui, sans-serif;
      background: #f7f8fa;
      color: #111827;
    }
    main {
      width: min(520px, calc(100% - 32px));
      background: #fff;
      border: 1px solid rgba(0,0,0,0.07);
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.05);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 18px;
    }
    p {
      margin: 0 0 14px;
      color: #6b7280;
      line-height: 1.6;
    }
    code {
      display: block;
      padding: 10px 12px;
      background: #f2f4f7;
      border-radius: 6px;
      color: #111827;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <main>
    <h1>CALG is now a Flask application</h1>
    <p>Start the backend and open the Flask URL. The browser-only calculator has been removed so all regression work runs in Python.</p>
    <code>python app.py</code>
    <p style="margin-top:14px">Then open:</p>
    <code>http://127.0.0.1:5000</code>
  </main>
</body>
</html>
